[package]
name = "code-backup"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Fast, incremental backups of your GitHub repositories"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
flate2 = "1.1.11"
futures = "0.3.34"
globset = "0.4.21"
humantime = "2.4.0"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "io-util"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
zstd = { version = "0.14.3", features = ["zstdmt"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
